<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Templates</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Choose a Resume Template</h1>
        <div class="row">
            {% for template in templates %}
                <div class="col-md-4 mb-4">
                    <div class="card">
                        {% if template.preview_image %}
                            <img src="{{ template.preview_image }}" class="card-img-top" alt="{{ template.name }}">
                        {% else %}
                            <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="No Preview Available">
                        {% endif %}
                        <div class="card-body">
                            <h5 class="card-title">{{ template.name }}</h5>
                            <p class="card-text">{{ template.description }}</p>
                            <a href="{{ url_for('resume_preview', template_id=template.id) }}" class="btn btn-primary">Use This Template</a>
                        </div>
                    </div>
                </div>
            {% else %}
                <div class="col-12">
                    <p>No templates available.</p>
                </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
